<div class="container">
    <header>
        <h1>LANÇAMENTO DE PEDIDOS (PDV)</h1>
    </header>

    <form id="formPedido">
        <!-- CABEÇALHO DO PEDIDO -->
        <div class="form-group-row">
            <div class="form-group small">
                <label for="txtIDPedido">Nº Pedido:</label>
                <input type="text" id="txtIDPedido" disabled placeholder="Novo">
            </div>
            <div class="form-group large">
                <label for="cbClientePedido">Cliente*:</label>
                <select id="cbClientePedido" required>
                    <option value="" disabled selected>Selecione o Cliente</option>
                    <option value="1">ALFA TRANSPORTES LTDA (CNPJ: 12.345.678/0001-99)</option>
                    <option value="2">MECÂNICA DO GORDO LTDA (CNPJ: 98.765.432/0001-11)</option>
                    <option value="3">CHRISTIAN DE SOUZA SILVA (CPF: 012.345.678-90)</option>
                </select>
            </div>
        </div>

        <!-- ENTRADA RÁPIDA DE ITENS (LANÇAMENTO) -->
        <div class="permissions-section-box" style="margin-top: 15px; background-color: #f8fafc;">
            <label class="section-title-label"><i class="fa-solid fa-barcode"></i> Lançar Item no Carrinho</label>
            <div class="form-group-row">
                <div class="form-group large">
                    <label for="cbProdutoPedido">Produto *:</label>
                    <select id="cbProdutoPedido">
                        <option value="" disabled selected>Selecione o Produto para adicionar</option>
                        <option value="1" data-preco="37.50">Oleo Motor Lubrax Tecno 10W40 1L (R$ 37,50)</option>
                        <option value="2" data-preco="490.00">Pneu Pirelli Cinturato P7 205/55R16 (R$ 490,00)</option>
                        <option value="3" data-preco="90.00">Pastilha de Freio Dianteira Bosch Eco (R$ 90,00)</option>
                    </select>
                </div>
                <div class="form-group small" style="min-width: 100px;">
                    <label for="txtQtdPedido">Qtd *:</label>
                    <input type="number" id="txtQtdPedido" min="1" value="1">
                </div>
                <div class="form-group" style="flex: 0 1 120px; justify-content: flex-end;">
                    <button type="button" id="btnAdicionarItem" class="btn-secondary" style="width: 100%; padding: 10px;"><i class="fa-solid fa-plus"></i> Inserir</button>
                </div>
            </div>
        </div>

        <!-- PAINEL PARA VISUALISAR ITENS (JTABLE DO PDV) -->
        <div class="table-responsive-wrapper" style="margin-top: 20px; max-height: 250px; overflow-y: auto;">
            <table class="data-table-grid" id="tblItensPedido">
                <thead>
                    <tr>
                        <th style="width: 60px; text-align: center;">Item</th>
                        <th style="width: 80px; text-align: center;">ID Prod</th>
                        <th>Descrição do Produto</th>
                        <th style="width: 90px; text-align: center;">Qtd</th>
                        <th style="width: 130px; text-align: right;">Preço Unit.</th>
                        <th style="width: 140px; text-align: right;">Subtotal</th>
                        <th style="width: 70px; text-align: center;">Ações</th>
                    </tr>
                </thead>
                <tbody id="tbodyItensPedido">
                    <!-- Linhas alimentadas via JavaScript -->
                </tbody>
            </table>
        </div>

        <!-- CONDIÇÕES DE PAGAMENTO E TAXAS -->
        <div class="form-group-row" style="margin-top: 20px;">
            <div class="form-group">
                <label for="cbFormaPagto">Forma de Pagamento *:</label>
                <select id="cbFormaPagto" required>
                    <option value="" disabled selected>Selecione</option>
                    <option value="PIX">PIX (5% Desc.)</option>
                    <option value="CARTÃO CRÉDITO">Cartão de Crédito</option>
                    <option value="CARTÃO DÉBITO">Cartão de Débito</option>
                    <option value="DINHEIRO">Dinheiro</option>
                </select>
            </div>
            <div class="form-group">
                <label for="cbTipoFretePedido">Tipo de Frete:</label>
                <select id="cbTipoFretePedido">
                    <option value="" selected>Sem Frete</option>
                    <option value="SEDEX">SEDEX</option>
                    <option value="PAC">PAC</option>
                    <option value="CIF">CIF</option>
                    <option value="FOB">FOB</option>
                </select>
            </div>
            <div class="form-group">
                <label for="txtValorFretePedido">Valor Frete (R$):</label>
                <input type="text" id="txtValorFretePedido" value="0,00">
            </div>
        </div>

        <div class="form-group-row" style="margin-top: 15px;">
            <div class="form-group">
                <label for="txtDescontoPedido">Desconto (%):</label>
                <input type="text" id="txtDescontoPedido" value="0,0">
            </div>
            <div class="form-group">
                <label for="txtImpostoPedido">Imposto/Taxas (R$):</label>
                <input type="text" id="txtImpostoPedido" value="0,00">
            </div>
            <!-- DISPLAY GRANDE DO TOTAL DO PDV -->
            <div class="form-group total-display-box">
                <span class="total-label">VALOR TOTAL DO PEDIDO</span>
                <span class="total-value" id="lblTotalPedido">R$ 0,00</span>
            </div>
        </div>

        <div class="button-panel" style="margin-top: 30px;">
            <button type="button" id="btnPesquisarPedido" class="btn-secondary"><i class="fa-solid fa-magnifying-glass"></i> Pesquisar</button>
            <button type="button" id="btnLimparPedido" class="btn-neutral"><i class="fa-solid fa-eraser"></i> Limpar</button>
            <button type="submit" id="btnSalvarPedido" class="btn-primary"><i class="fa-solid fa-cash-register"></i> Finalizar Venda</button>
        </div>
    </form>
</div>
