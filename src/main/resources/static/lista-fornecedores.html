<div class="container">
    <header>
        <h1>LISTA DE FORNECEDORES</h1>
    </header>

    <!-- Barra de Filtro Rápido em Tempo Real -->
    <div class="form-group-row" style="margin-bottom: 20px; align-items: flex-end;">
        <div class="form-group large">
            <label for="txtFiltroFornecedor"><i class="fa-solid fa-magnifying-glass"></i> Filtrar por Razão Social, CNPJ ou Cidade:</label>
            <input type="text" id="txtFiltroFornecedor" placeholder="Digite para pesquisar em tempo real...">
        </div>
    </div>

    <!-- Tabela Responsiva com Rolagem Horizontal -->
    <div class="table-responsive-wrapper" style="max-height: 500px; overflow-y: auto;">
        <table class="data-table-grid" id="tblListaFornecedores" style="min-width: 1700px;">
            <thead>
                <tr>
                    <th style="width: 70px; text-align: center;">ID</th>
                    <th style="width: 250px; text-align: left;">Razão Social</th>
                    <th style="width: 180px;">Nome Fantasia</th>
                    <th style="width: 150px;">CNPJ</th>
                    <th style="width: 130px;">Inscrição Estadual</th>
                    <th style="width: 150px;">Ramo de Atividade</th>
                    <th style="width: 140px;">Nome Vendedor</th>
                    <th style="width: 130px;">Telefone Contato</th>
                    <th style="width: 180px;">E-mail</th>
                    <th style="width: 200px;">Rua</th>
                    <th style="width: 130px;">Bairro</th>
                    <th style="width: 140px;">Cidade</th>
                    <th style="width: 60px; text-align: center;">UF</th>
                    <th style="width: 110px;">CEP</th>
                    <th style="width: 110px; text-align: center;">Data Cadastro</th>
                    <th style="width: 250px;">Dados Bancários</th>
                    <th>Observações</th>
                    <th style="width: 120px; text-align: center;">Ações</th>
                </tr>
            </thead>
            <tbody id="tbodyListaFornecedores">
                <!-- Alimentado dinamicamente via JavaScript -->
            </tbody>
        </table>
    </div>
</div>
