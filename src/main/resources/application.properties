# Configura\u00e7\u00f5es de Conex\u00e3o com o Banco MySQL do PI
spring.datasource.url=jdbc:mysql://localhost:3000/rj_bd?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configura\u00e7\u00f5es do Hibernate/JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Define a porta do servidor backend para n\u00e3o conflitar com outros servi\u00e7os
server.port=8080

